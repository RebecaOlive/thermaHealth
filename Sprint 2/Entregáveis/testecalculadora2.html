<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora 2</title>
</head>
<body>
    <h3>A falta de monitoramento os parametros de temperatura e umidade de salas hospitalares pode levar a inúmeros prejuizos!</h3><br>


    <p>Informe quanto você gasta diariamente por paciente:</p>

    R$ <input type="number" id="input_paciente"><br>


    <p>Informe a média de estadia dos pacientes na unidade:</p>

    <input type="number" id="input_media"> dias<br><br>


    <button onclick="calcular()">Veja os Riscos!</button>
    <br><br>

    <div id="msg"></div>
</body>
</html>
<script>
    function calcular() {
        // Captação de Valores:
        var gasto = Number(input_paciente.value);
        var media = Number(input_media.value);

        // Formatação de Valores:
        var mensagem = "";
        var gastoTotal = gasto * media;
        var aCobrar = gastoTotal * 2;

        // Estipulação de Prejuizos:
        var prejuizo3 = gastoTotal + (gasto * 3);
        var prejuizo5 = gastoTotal + (gasto * 5);
        var prejuizoTotal = gastoTotal * (gasto * 7);


        mensagem = `<h1>SEU PREJUIZO É DE ATÉ R$${prejuizoTotal}</h1><br> Permanência estendida em:<br>3 dias = R$${prejuizo3}; 5 dias = R$${prejuizo5}; 7 dias = R$${prejuizoTotal}<br><button onclick="solucao()">Aplique Nossa Solução!</button>`;

        msg.innerHTML = mensagem;
    }
    function solucao() {
        // Captação de Valores:
        var gasto = Number(input_paciente.value);
        var media = Number(input_media.value);

        // Formatação de Valores:
        var mensagem = "";
        var gastoTotal = gasto * media;
        var aCobrar = gastoTotal * 2;

        mensagem = `<h1> SEU GANHO SE TORNA R$${aCobrar}</h1>`;
        msg.innerHTML = mensagem;
    }
</script>
